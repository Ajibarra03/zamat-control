name: Hogar Compartido Android APK
on:
  push:
    branches: [build-hogar-compartido-apk]
    paths:
      - 'hogar-apk/**'
      - '.github/workflows/hogar-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p hogar-apk :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hogar_Compartido_Android_v1_0_APK
          path: hogar-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
