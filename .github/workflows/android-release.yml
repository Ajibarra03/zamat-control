name: ZAMAT Android V0.1.3

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app.css'
      - 'responsive-v0.1.3.css'
      - 'service-worker.js'
      - 'index.html'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/icon-512.png android/app/src/main/res/drawable/zamat_icon.png

      - name: Build installable APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Prepare release files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ZAMAT-Control-V0.1.3.apk
          zip -r ZAMAT-Control-Web-V0.1.3.zip index.html app.css responsive-v0.1.3.css app.js manifest.webmanifest service-worker.js assets README.md

      - name: Create or update GitHub Release V0.1.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view V0.1.3 >/dev/null 2>&1; then
            gh release upload V0.1.3 ZAMAT-Control-V0.1.3.apk ZAMAT-Control-Web-V0.1.3.zip --clobber
          else
            gh release create V0.1.3 \
              ZAMAT-Control-V0.1.3.apk \
              ZAMAT-Control-Web-V0.1.3.zip \
              --target "$GITHUB_SHA" \
              --title "ZAMAT Control V0.1.3" \
              --notes "Corrección integral de áreas seguras: amplía el espacio superior para evitar que hora, batería, señal, Wi-Fi, notch o cámara se superpongan con ZAMAT y reserva espacio inferior para gestos o botones de navegación. Incluye web y APK Android."
          fi
