name: ZAMAT Android V0.1.2

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app.css'
      - 'responsive-v0.1.1.css'
      - 'service-worker.js'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/icon-512.png android/app/src/main/res/drawable/zamat_icon.png

      - name: Build installable APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Prepare release files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ZAMAT-Control-V0.1.2.apk
          zip -r ZAMAT-Control-Web-V0.1.2.zip index.html app.css responsive-v0.1.1.css app.js manifest.webmanifest service-worker.js assets README.md

      - name: Create or update GitHub Release V0.1.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view V0.1.2 >/dev/null 2>&1; then
            gh release upload V0.1.2 ZAMAT-Control-V0.1.2.apk ZAMAT-Control-Web-V0.1.2.zip --clobber
          else
            gh release create V0.1.2 \
              ZAMAT-Control-V0.1.2.apk \
              ZAMAT-Control-Web-V0.1.2.zip \
              --target "$GITHUB_SHA" \
              --title "ZAMAT Control V0.1.2" \
              --notes "Mejora de visualización móvil: respeta la barra de estado, notch/cámara y la barra o botones de navegación inferiores. Incluye web y APK Android conectados a Supabase en tiempo real."
          fi
